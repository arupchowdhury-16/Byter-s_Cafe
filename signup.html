<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Byter's Cafe</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="cafe.ico" type="image/x-icon">
</head>
<body>
    <div class="signup-container">
        <h2>Join Byter's Cafe</h2>
        <form action="/signup" method="POST">
            <div class="form-group">
                <label for="username">Choose a User ID</label>
                <input type="text" id="username" name="username" required placeholder="e.g., CoffeeLover23">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label for="password">Create a Password</label>
                <input type="password" id="password" name="password" required placeholder="Must be at least 8 characters">
            </div>
            <button type="submit" class="signup-btn">Create Account</button>
        </form>
        <p class="login-link">
            Already have an account? <a href="login.html">Login here</a>
        </p>
    </div>
   
    <style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f4f4f2;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

.signup-container {
    background-color: #ffffff; 
    padding: 40px;
    border-radius: 12px;
   
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); 
    width: 100%;
    max-width: 450px; 
    text-align: center;
}

.signup-container h2 {
    color: #4a2e1f; 
    margin-bottom: 30px;
    font-size: 2em;
    border-bottom: 2px solid #a68b75;
    padding-bottom: 10px;
}


.form-group {
    margin-bottom: 20px;
    text-align: left;
}


.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #5d4037;
}


.form-group input[type="text"],
.form-group input[type="password"],
.form-group input[type="email"] {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box; 
    font-size: 1em;
    transition: border-color 0.3s ease;
}

.form-group input:focus {
    border-color: #7b5e57; 
    outline: none;
    box-shadow: 0 0 5px rgba(123, 94, 87, 0.3);
}


.signup-btn {
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 1.1em;
    font-weight: 700;
    width: 100%;
    margin-top: 20px;
    transition: background-color 0.3s ease, transform 0.1s ease;
}

.signup-btn:hover {
    background-color: #5d4037;
    transform: translateY(-1px);
}

.signup-btn:active {
    background-color: #4a2e1f;
    transform: translateY(0);
}


.login-link {
    margin-top: 25px;
    font-size: 0.95em;
    color: #666;
}

.login-link a {
    color: #a68b75; 
    text-decoration: none;
    font-weight: 600;
    transition: color 0.3s ease;
}

.login-link a:hover {
    color: #7b5e57;
    text-decoration: underline;
}


::placeholder {
    color: #aaa;
    font-style: italic;
}

    </style>
</body>
</html>
